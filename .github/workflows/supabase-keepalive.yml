name: Supabase Keepalive

on:
  schedule:
    - cron: '0 */5 * * *'  # setiap 5 jam
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Hit Supabase to prevent idle pause
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_KEY:-}" || -z "${SUPABASE_TABLE:-}" ]]; then
            echo "Missing SUPABASE_URL, SUPABASE_ANON_KEY, or SUPABASE_TABLE secret"
            exit 1
          fi

          # buang trailing slash
          BASE_URL="${SUPABASE_URL%/}"

          STATUS=$(curl --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            -o response.txt \
            -w "%{http_code}" \
            "${BASE_URL}/rest/v1/${SUPABASE_TABLE}?select=*&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "HTTP status: ${STATUS}"
          cat response.txt
          echo

          if [[ "${STATUS}" -lt 200 || "${STATUS}" -ge 300 ]]; then
            echo "Keepalive failed"
            exit 1
          fi

          echo "Keepalive OK"
